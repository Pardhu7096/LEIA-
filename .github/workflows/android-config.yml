name: Android build config

on:
  pull_request:
    paths:
      - "agent-app/**"
      - "frontend/**"
      - "scripts/android/**"
      - ".gitignore"
      - ".github/workflows/android-config.yml"
  push:
    branches: [staging/render-leia, main]
    paths:
      - "agent-app/**"
      - "frontend/**"
      - "scripts/android/**"
      - ".gitignore"

permissions:
  contents: read

jobs:
  android-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned identity, permissions and secret guard
        run: python scripts/android/check_android_config.py
      - name: PowerShell build scripts parse cleanly
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/android -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { $failed = $true; $parseErrors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
            else { Write-Host "OK $($_.Name)" }
          }
          if ($failed) { exit 1 }
