name: CRM checks
on:
  push:
    paths: ['agent-app/**', 'backend/**', 'frontend/**', 'deploy/**', '.github/workflows/*.yml']
  # No path filter here. These jobs are meant to be required checks on main, and a
  # required check that never starts (for example on a docs-only pull request)
  # leaves the pull request unmergeable.
  pull_request:
permissions:
  contents: read
jobs:
  agent-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: agent-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:forms
      - run: node --experimental-strip-types --test tests/staffSession.test.mjs tests/apiUrl.test.mjs
  crm-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: crm-test-only
          POSTGRES_DB: crm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:crm-test-only@localhost:5432/crm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m pytest backend/tests -q

  customer-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test tests/roomTours.test.mjs tests/apiUrl.test.mjs
